name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: kad-ball
      - name: Skipped (no FIREBASE_SERVICE_ACCOUNT secret)
        if: env.HAS_SA != 'true'
        run: echo "Add the FIREBASE_SERVICE_ACCOUNT repo secret (run firebase init hosting:github) to enable deploys."
